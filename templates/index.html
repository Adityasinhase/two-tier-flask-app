<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flask App new🚀</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Inter, sans-serif
        }

:root {
    --app-background: linear-gradient(135deg, #ff6b6b, #feca57);
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
    background: var(--app-background);
    color: #fff;
}

        .container {
            max-width: 720px;
            width: 100%;
            padding: 36px;
            background: rgba(255, 255, 255, .08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .35)
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            font-size: 2.3rem;
            background: linear-gradient(90deg, #67e8f9, #8b5cf6, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent
        }

        .messages {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 320px;
            overflow: auto;
            padding: 18px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .05);
            margin-bottom: 20px
        }

        .messages p {
            padding: 14px 18px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(103, 232, 249, .15), rgba(139, 92, 246, .15))
        }

        #messageForm {
            display: flex;
            gap: 12px
        }

        input[type="text"] {
            flex: 1;
            padding: 15px;
            border-radius: 14px;
            background: rgba(255, 255, 255, .07);
            border: 1px solid rgba(255, 255, 255, .15);
            color: #fff
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #67e8f9;
            box-shadow: 0 0 0 4px rgba(103, 232, 249, .15)
        }

        input[type="submit"] {
            padding: 15px 24px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #06b6d4, #8b5cf6);
            color: #fff;
            font-weight: 700;
            cursor: pointer
        }

        @media(max-width:640px) {
            #messageForm {
                flex-direction: column
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Flask + MySQL App [3 tier] - Junoon 🔥</h1>

        <div class="messages">
            {% for message in messages %}
            <p>{{ message[0] }}</p>
            {% endfor %}
        </div>

        <form id="messageForm">
            <input type="text" name="new_message" placeholder="Type your message..." required>
            <input type="submit" value="Send">
        </form>
    </div>

    <!-- jQuery for Smooth AJAX Requests -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#messageForm").on("submit", function (event) {
                event.preventDefault(); // Prevent page reload

                let messageInput = $("input[name='new_message']");
                let message = messageInput.val().trim();

                if (message === "") {
                    alert("Message cannot be empty!");
                    return;
                }

                $.ajax({
                    url: "/submit",
                    type: "POST",
                    data: { new_message: message },
                    success: function (response) {
                        if (response && response.message) {
                            $(".messages").append("<p>" + response.message + "</p>");
                            messageInput.val("");
                        } else {
                            console.error("Unexpected response format:", response);
                        }
                    },
                    error: function (xhr, status, error) {
                        console.error("AJAX Error:", status, error);
                    }
                });
            });
        });
    </script>
</body>

</html>
